<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customize | The Art Factory</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">TAF</span><span><strong>THE ART FACTORY</strong><small>Custom Nameplates & Signs</small></span></a><nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="customizer.html">Customize</a><a href="gallery.html">Gallery</a><a href="corporate.html">Corporate</a><a href="contact.html">Contact</a></nav></header><main class="section-pad"><p class="eyebrow">CUSTOMIZER</p><h1>Create Your Nameplate</h1><div class="customizer"><div class="preview"><div class="mini-plate"><span id="previewName">YOUR NAME</span><br><small id="previewNo">HOUSE / FLAT NO.</small></div></div><form class="form-card" id="customForm"><label>Name</label><input name="name" placeholder="Your name" required oninput="previewName.textContent=this.value||'YOUR NAME'"><label>House / Flat Number</label><input name="number" placeholder="1603" oninput="previewNo.textContent=this.value||'HOUSE / FLAT NO.'"><label>Size</label><select name="size"><option>12 × 6 inch</option><option>15 × 7 inch</option><option>18 × 8 inch</option><option>Custom size</option></select><label>Finish</label><select name="finish"><option>Black Acrylic</option><option>Clear Acrylic</option><option>Gold Mirror</option><option>Frosted Acrylic</option></select><label>Lighting</label><select name="light"><option>No Light</option><option>Warm White</option><option>Cool White</option><option>RGB</option></select><button class="btn btn-dark" type="submit">Add to Cart</button></form></div></main><script src="app.js"></script></body></html>
